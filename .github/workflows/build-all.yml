name: Build All GKI Drivers

on:
  workflow_dispatch:
    inputs:
      kernels:
        description: '内核版本'
        required: true
        default: 'android12-5.10 android13-5.10 android13-5.15 android14-5.15 android14-6.1 android15-6.6 android16-6.12 android17-6.18'


jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Build matrix
        id: set
        run: |
          K="$(echo "${{ github.event.inputs.kernels }}" | tr -s ' ')"
          if [ -z "${K// /}" ]; then
            echo "::error::kernels 不能为空"
            exit 1
          fi
          echo "内核列表: $K"
          JSON="["
          for v in $K; do
            [ "$JSON" = "[" ] || JSON="$JSON,"
            JSON="$JSON\"$v\""
          done
          JSON="$JSON]"
          echo "matrix=$JSON" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        kernel: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost
          sudo docker image prune -af || true
          sudo apt-get clean || true
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --reinstall \
            build-essential gcc gcc-aarch64-linux-gnu \
            bc bison flex libssl-dev libelf-dev \
            rsync zip git curl python3
          sudo apt-get install -y --reinstall libyaml-0-2 libyaml-dev

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      - name: Fetch kernel source (repo)
        run: |
          mkdir -p kernels
          cd kernels
          v="${{ matrix.kernel }}"
          echo "拉取内核: $v"
          mkdir -p "$v" && cd "$v"
          repo init -u https://android.googlesource.com/kernel/manifest \
            -b "common-$v" --depth=1
          repo sync -c -j$(nproc) --no-tags --no-clone-bundle

      - name: Build drivers
        run: |
          chmod +x scripts/*.sh
          cd scripts
          ./build_all.sh ${{ matrix.kernel }}

      - name: Verify artifacts
        run: |
          echo "产物列表:"
          find dist -type f 2>/dev/null | sort || true
          if ! compgen -G "dist/*/*.ko" > /dev/null; then
            echo "::error::没有生成任何 .ko"
            exit 1
          fi
          echo "--- 产物 ---"
          find dist -name "*.ko" | sort

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gki-drivers-${{ matrix.kernel }}
          path: dist
          retention-days: 30

  package:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for git sha)
        uses: actions/checkout@v4

      - name: Download all KMI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: gki-drivers-*
          path: dist
          merge-multiple: true

      - name: Pack all-in-one
        run: |
          set -e
          echo "=== 合并后的目录 ==="
          find dist -type f | sort || true
          {
            echo "# ${{ github.event.repository.name }} 构建汇总"
            echo "commit=$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
            echo "workflow=${{ github.workflow }}"
            echo "run=${{ github.run_number }}"
            echo "script=build_all.sh"
            echo
            echo "产物："
            find dist -name "*.ko" | sort
          } > dist/SUMMARY.txt
          ( cd dist && zip -r ../ice-drivers-all.zip . )
          ls -lh ice-drivers-all.zip

      - name: Upload all-in-one
        uses: actions/upload-artifact@v4
        with:
          name: ice-drivers-all
          path: ice-drivers-all.zip
          retention-days: 30
