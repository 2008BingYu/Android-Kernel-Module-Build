name: Build All GKI Drivers

on:
  workflow_dispatch:
    inputs:
      kernels:
        description: '内核版本'
        required: true
        default: 'android12-5.10 android13-5.10 android13-5.15 android14-5.15 android14-6.1 android15-6.6 android16-6.12 android17-6.18'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 720

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --reinstall \
            build-essential gcc gcc-aarch64-linux-gnu \
            bc bison flex libssl-dev libelf-dev \
            rsync zip git curl python3
          sudo apt-get install -y --reinstall libyaml-0-2 libyaml-dev

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      - name: Fetch kernel source (repo)
        run: |
          mkdir -p kernels
          cd kernels

          KERNELS="${{ github.event.inputs.kernels }}"
          for v in $KERNELS; do
            echo "============================================================"
            echo "拉取内核: $v  (repo init -b common-$v)"
            echo "============================================================"

            mkdir -p "$v"
            cd "$v"

            repo init -u https://android.googlesource.com/kernel/manifest \
              -b "common-$v" --depth=1 || { echo "  ⚠ $v repo init 失败，跳过"; cd ..; continue; }

            repo sync -c -j$(nproc) --no-tags --no-clone-bundle \
              || { echo "  ⚠ $v repo sync 失败，跳过"; cd ..; continue; }

            cd ..
          done

          echo ""
          echo "已拉取的内核目录:"
          ls -la

      - name: Prepare build_all.sh
        run: |
          chmod +x scripts/build_all.sh
          head -20 scripts/build_all.sh

      # ============================================================
      # 新增：Debug 检查每个内核里有什么
      # ============================================================
      - name: Debug kernel content
        if: always()
        run: |
          for d in kernels/*/; do
            v=$(basename "$d")
            echo "============================================================"
            echo "内核: $v"
            echo "============================================================"
            echo "--- 顶层目录 ---"
            ls -la "$d" | head -30
            echo ""
            echo "--- prebuilts-master 检查 ---"
            ls -d "$d/prebuilts-master" 2>/dev/null && ls "$d/prebuilts-master/clang/host/linux-x86/" 2>/dev/null | head -10 || echo "  ✘ prebuilts-master 不存在"
            echo ""
            echo "--- prebuilts 检查 ---"
            ls -d "$d/prebuilts" 2>/dev/null && ls "$d/prebuilts/clang/host/linux-x86/" 2>/dev/null | head -10 || echo "  ✘ prebuilts 不存在"
            echo ""
            echo "--- build.config.common 里的 clang 字段 ---"
            grep -i "clang" "$d/common/build.config.common" 2>/dev/null || echo "  ✘ 没有 clang 字段"
            echo ""
            echo "--- 查找 clang 可执行文件 ---"
            find "$d" -path "*/bin/clang" -type f 2>/dev/null | head -5 || echo "  ✘ 没找到"
            echo ""
          done

      - name: Build drivers
        run: |
          cd scripts
          ./build_all.sh ${{ github.event.inputs.kernels }}

      - name: Package artifacts
        if: always()
        run: |
          mkdir -p output
          cp -r modules/build output/ 2>/dev/null || true
          cp -r scripts/build_logs output/ 2>/dev/null || true
          echo "============================================================"
          echo "产物列表:"
          find output -type f | sort || true
          echo "============================================================"
          cd output && zip -r ../drivers_all.zip . || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gki-drivers-all
          path: |
            output/
            drivers_all.zip
          retention-days: 30
