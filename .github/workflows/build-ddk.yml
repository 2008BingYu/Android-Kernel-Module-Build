name: Build Drivers (DDK)

on:
  workflow_dispatch:
    inputs:
      kernels:
        description: '内核版本（空格分隔，必填）'
        required: true
        default: 'android12-5.10 android13-5.10 android13-5.15 android14-5.15 android14-6.1 android15-6.6 android16-6.12 android17-6.18'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Build matrix
        id: set
        run: |
          K="$(echo "${{ github.event.inputs.kernels }}" | tr -s ' ')"
          if [ -z "${K// /}" ]; then
            echo "::error::kernels 不能为空"
            exit 1
          fi
          echo "内核列表: $K"
          JSON="["
          for v in $K; do
            [ "$JSON" = "[" ] || JSON="$JSON,"
            JSON="$JSON\"$v\""
          done
          JSON="$JSON]"
          echo "matrix=$JSON" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        kernel: ${{ fromJson(needs.prepare.outputs.matrix) }}
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kernel }}
      options: --privileged

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build driver with DDK
        run: |
          chmod +x scripts/*.sh
          scripts/build_ddk.sh ${{ matrix.kernel }}

      - name: Verify artifacts
        run: |
          find out -type f | sort || true
          if ! compgen -G "out/${{ matrix.kernel }}/*.ko" > /dev/null; then
            echo "::error::没有生成 .ko"
            exit 1
          fi

      - name: Compute artifact name
        id: art
        run: |
          ko=$(ls out/${{ matrix.kernel }}/*.ko | head -1)
          echo "name=$(basename "$ko" .ko)" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.art.outputs.name }}
          path: out/${{ matrix.kernel }}/*.ko
          retention-days: 30

  package:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all KMI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-android*'
          path: out
          merge-multiple: true

      - name: Compute package name
        id: pkg
        run: |
          f=$(ls out/*.ko | head -1)
          [ -n "$f" ] || { echo "没有产物"; exit 1; }
          product=$(basename "$f" .ko | sed 's/-android[0-9]*-[0-9.]*$//')
          echo "product=$product" >> "$GITHUB_OUTPUT"
          echo "包名: ${product}-out"

      - name: Pack ${{ steps.pkg.outputs.product }}-out.zip
        run: |
          set -e
          for f in out/*.ko; do
            [ -f "$f" ] || continue
            kmi=$(basename "$f" .ko | sed -n 's/.*-\(android[0-9]*-[0-9.]*\)$/\1/p')
            [ -n "$kmi" ] || { echo "无法解析 KMI: $f"; exit 1; }
            mkdir -p "out/$kmi"
            mv "$f" "out/$kmi/"
          done
          echo "=== 汇总结构 ==="
          find out -name '*.ko' | sort
          ( cd out && zip -r "../${{ steps.pkg.outputs.product }}-out.zip" android* )
          ls -lh "${{ steps.pkg.outputs.product }}-out.zip"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.product }}-out
          path: ${{ steps.pkg.outputs.product }}-out.zip
          retention-days: 30
